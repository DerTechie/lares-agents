[project]
name = "lares"
version = "0.0.0"
description = "Local-first AI agents for the Linux desktop, built on Ollama."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mike Esser", email = "info@dertechie.de" }]
keywords = ["kde", "plasma", "kmail", "krunner", "ollama", "local-ai", "linux-desktop"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: X11 Applications :: KDE",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
lares = "lares.kmail.cli:main"

[project.urls]
Homepage = "https://github.com/DerTechie/lares-agents"
Issues = "https://github.com/DerTechie/lares-agents/issues"

[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.20"
ninja.make-fallback = true
wheel.packages = ["src/lares"]
build-dir = "build/{wheel_tag}"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.32",
    "freezegun>=1.5",
    "ruff>=0.7",
    "pyright>=1.1.385",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RET",
    "T20", "PT", "TCH", "ANN", "N", "RUF", "PL",
]
ignore = [
    "PLR0913",  # too many arguments — judgement call, not a rule
]

[tool.ruff.lint.per-file-ignores]
# Tests don't need return-type annotations; magic numbers are normal in assertions.
"tests/**/*.py" = ["ANN", "PLR2004"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic v2 models need annotations available at runtime, not just under TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
# Several KDE-adjacent libraries (dbus-next, akonadi bindings) ship partial stubs;
# don't make missing stubs a hard fail.
reportMissingTypeStubs = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "strict"
markers = [
    "integration: integration tests that require a live Akonadi or Ollama instance (deselect with '-m \"not integration\"')",
]
